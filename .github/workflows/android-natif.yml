# Appli Android native : construite ici, jamais sur le poste de développement.
# Chaque envoi qui touche apps/android-natif lance les tests et produit l'APK,
# signé avec la clé de l'ancienne appli (Trusted Web Activity) pour
# s'installer par-dessus. « Run workflow » publie en plus une version
# téléchargeable (onglet Releases).
name: Android - appli native

on:
  push:
    branches: [main]
    paths:
      - "apps/android-natif/**"
      - "apps/android/cle/**"
      # Le chiffrement du web : l'appli doit rester compatible octet pour octet.
      - "packages/chiffrement/**"
      - ".github/workflows/android-natif.yml"
  workflow_dispatch:

concurrency:
  group: android-natif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android-natif
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      # Le chiffrement Kotlin a relu les jeux d'essai du web ; le web relit maintenant ce que Kotlin a chiffré.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Le web relit le chiffrement Kotlin
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          cd packages/chiffrement
          export VECTEURS="$GITHUB_WORKSPACE/apps/android-natif/app/src/test/resources/vecteurs-web.json"
          export SORTIE_KOTLIN="$GITHUB_WORKSPACE/apps/android-natif/app/build/sortie-kotlin.json"
          npx vitest run test/kotlin.test.ts

      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: apps/android-natif/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Déchiffrer la clé
        env:
          UNICHAT_CLE: ${{ secrets.UNICHAT_CLE }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../android/cle/unichat.p12.enc -out "$RUNNER_TEMP/unichat.p12" -pass env:UNICHAT_CLE
          # Empreintes publiques du certificat : le client OAuth Android de Google Cloud les demande.
          keytool -list -v -storetype pkcs12 -keystore "$RUNNER_TEMP/unichat.p12" -storepass "$UNICHAT_CLE" -alias unichat \
            | grep -E "SHA1:|SHA256:" | sed 's/^\s*/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Construire
        env:
          UNICHAT_MAGASIN: ${{ runner.temp }}/unichat.p12
          UNICHAT_SECRET: ${{ secrets.UNICHAT_CLE }}
          UNICHAT_ALIAS: unichat
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/unichat.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: unichat-natif-apk
          path: apps/android-natif/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publier
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/unichat.apk"
          gh release create "natif-v$version" "$RUNNER_TEMP/unichat.apk" --title "UniChat $version" \
            --notes "Appli Android native. Elle s'installe par-dessus l'appli actuelle." --latest
