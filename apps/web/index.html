<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniChat</title>
    <meta name="description" content="UniChat : messagerie simple et sécurisée, sur le web, Android et ordinateur." />
    <!-- Barre d'état du téléphone : la couleur de l'en-tête, en clair comme en sombre. -->
    <meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1c25" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="racine">
      <!-- Écran de chargement visible avant l'exécution du JavaScript ; le
           composant Chargement reprend exactement le même rendu. -->
      <div class="fixed inset-0 flex items-center justify-center bg-fond">
        <div class="flex w-72 flex-col items-center">
          <svg class="size-16 text-texte-3" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="currentColor" d="M24 3C12.4 3 3 11.5 3 22c0 5.6 2.7 10.6 7 14.1L8.4 45l9-4.8c2.1.6 4.3.8 6.6.8 11.6 0 21-8.5 21-19S35.6 3 24 3z" />
            <path class="stroke-fond" fill="none" stroke-linecap="round" stroke-width="3.4" d="M16.5 14.5v8.2a7.5 7.5 0 0 0 15 0v-8.2" />
          </svg>
          <div class="mt-12 h-1 w-full overflow-hidden rounded-full bg-bordure">
            <div class="barre-chargement h-full rounded-full bg-primaire"></div>
          </div>
          <p class="mt-6 text-[17px] text-texte">UniChat</p>
        </div>
      </div>
    </div>
    <noscript>
      <div class="mx-auto max-w-xl px-5 py-10 text-texte">
        <h1 class="text-2xl">UniChat</h1>
        <p class="mt-3 text-texte-2">
          Messagerie gratuite sur le web, Android et ordinateur : discussions en temps réel avec vos contacts, connexion
          avec votre compte Google. Activez JavaScript pour utiliser l'application.
        </p>
        <p class="mt-4">
          <a class="text-primaire underline" href="/confidentialite">Règles de confidentialité</a> ·
          <a class="text-primaire underline" href="/conditions">Conditions d'utilisation</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
